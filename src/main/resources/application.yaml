spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/monolith
    username: postgres
    password: secretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernaate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true

  application:
    name: monolith-core
